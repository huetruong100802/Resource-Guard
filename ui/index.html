<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resource Guard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f6fdb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>Resource Guard</div>
    <nav class="nav" id="nav" aria-label="Điều hướng chính"></nav>
    <div class="side-foot">
      <div class="row"><span class="dot" id="dot"></span><span id="connTxt">đang kết nối…</span></div>
      <div class="row">Mẫu tiếp theo sau <b class="num" id="cd">–</b>s</div>
      <button class="btn sm quit" id="quitBtn" title="Dừng giám sát và tắt Resource Guard">Thoát Resource Guard</button>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <h1 id="pageTitle">Trang chủ</h1>
      <span class="badge" id="badge">…</span>
      <span class="sp"></span>
      <button class="icon-btn" id="themeBtn" aria-label="Đổi giao diện sáng/tối"></button>
    </div>
    <div class="lost" id="lost" role="alert"><b>Mất kết nối với Resource Guard.</b> Ứng dụng có thể đã bị tắt. Mở lại bằng lối tắt <b>Resource Guard</b> (Start Menu) hoặc lệnh <code>rg start</code>; trang này sẽ tự nối lại khi app chạy trở lại.</div>
    <div id="page"></div>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<script src="/static/core.js"></script>
<script src="/static/viz.js"></script>
<script src="/static/p-overview.js"></script>
<script src="/static/p-home.js"></script>
<script src="/static/p-proc.js"></script>
<script src="/static/p-disk.js"></script>
<script src="/static/p-clean.js"></script>
<script src="/static/p-auto.js"></script>
<script src="/static/p-agent.js"></script>
<script src="/static/p-setup.js"></script>
<script src="/static/boot.js"></script>
</body>
</html>
